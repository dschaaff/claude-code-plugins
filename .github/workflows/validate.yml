name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # scripts/validate-skills.sh shells out to uvx to fetch the Agent Skills
      # reference validator.
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      # Same hook set developers run locally, so the two cannot drift.
      - run: uvx prek@0.4.13 run --all-files --show-diff-on-failure
